<!-- @dsCard group="Recording" height=330 subtitle="Camera, Screen, Screen + camera, and where the prompter goes in each" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mode switcher — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Readex+Pro:wght@300..700&family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Reem+Kufi:wght@400..700&family=Caveat:wght@500..700&family=Aref+Ruqaa:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
  html, body { margin: 0; }
  body { padding: 16px; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  svg { width: 100%; max-width: 520px; height: 200px; }
  .dev { fill: var(--surface); stroke: var(--line-strong); stroke-width: 2; }
  .scr { fill: var(--surface-sunk); }
  .stg { fill: var(--stage); }
  .txt { fill: var(--stage-text); }
  .txt-read { fill: var(--stage-text); opacity: 0.35; }
  .line { stroke: var(--stage-text); stroke-opacity: 0.3; stroke-width: 1; }
  .lens { fill: var(--ink); }
  .rec { fill: var(--rec); }
  .hud { fill: var(--stage-chrome); }
  .bub { fill: var(--ink-3); }
  .ui { fill: var(--line); }
  .desc { max-width: 520px; text-align: center; color: var(--ink-2); font-size: 14px; line-height: 20px; min-height: 40px; }
  .scene { transition: opacity var(--dur-base) var(--ease-standard); }
</style>
</head>
<body class="sa">
<div class="wrap">
  <div class="sa-seg" role="group" aria-label="Recording mode">
    <button aria-pressed="true" data-m="camera"><span class="sa-i">videocam</span>Camera</button>
    <button aria-pressed="false" data-m="screen"><span class="sa-i">screen_share</span>Screen</button>
    <button aria-pressed="false" data-m="both"><span class="sa-i">picture_in_picture_alt</span>Screen + camera</button>
  </div>
  <svg viewBox="0 0 520 200" role="img" aria-label="Where the prompter goes">
    <!-- Camera: a phone, prompter over the top of the preview near the lens. -->
    <g class="scene" id="camera">
      <rect class="dev" x="205" y="6" width="110" height="188" rx="16"></rect>
      <rect class="scr" x="213" y="18" width="94" height="164" rx="8"></rect>
      <rect class="stg" x="213" y="18" width="94" height="72" rx="8" opacity="0.85"></rect>
      <rect class="txt-read" x="223" y="32" width="60" height="6" rx="3"></rect>
      <line class="line" x1="213" y1="48" x2="307" y2="48"></line>
      <rect class="txt" x="223" y="53" width="74" height="7" rx="3.5"></rect>
      <rect class="txt" x="223" y="66" width="52" height="7" rx="3.5"></rect>
      <circle class="lens" cx="260" cy="12" r="3"></circle>
      <circle class="dev" cx="260" cy="162" r="11"></circle><circle class="rec" cx="260" cy="162" r="7"></circle>
      <rect class="dev" x="340" y="30" width="150" height="100" rx="8"></rect>
      <rect class="scr" x="348" y="38" width="134" height="84" rx="4"></rect>
      <rect class="stg" x="385" y="38" width="60" height="30" rx="4" opacity="0.9"></rect>
      <rect class="txt" x="391" y="49" width="46" height="5" rx="2.5"></rect>
      <circle class="lens" cx="415" cy="34" r="2.5"></circle>
      <rect class="bub" x="455" y="100" width="22" height="16" rx="3"></rect>
      <rect class="ui" x="365" y="140" width="100" height="6" rx="3"></rect>
      <rect class="dev" x="30" y="40" width="140" height="120" rx="10"></rect>
      <rect class="stg" x="38" y="48" width="124" height="104" rx="6"></rect>
      <rect class="txt" x="50" y="80" width="100" height="8" rx="4"></rect>
      <rect class="txt" x="50" y="96" width="76" height="8" rx="4"></rect>
    </g>
    <!-- Screen: a monitor, prompter window under the webcam, HUD at the bottom. -->
    <g class="scene" id="screen" opacity="0">
      <rect class="dev" x="80" y="6" width="360" height="188" rx="12"></rect>
      <rect class="scr" x="92" y="20" width="336" height="164" rx="4"></rect>
      <rect class="ui" x="92" y="20" width="70" height="164"></rect>
      <rect class="ui" x="180" y="100" width="110" height="34" rx="5"></rect><rect class="ui" x="300" y="100" width="110" height="34" rx="5"></rect>
      <circle class="lens" cx="260" cy="13" r="3"></circle>
      <rect class="stg" x="195" y="24" width="130" height="44" rx="7" opacity="0.88"></rect>
      <rect class="txt-read" x="205" y="32" width="84" height="5" rx="2.5"></rect>
      <line class="line" x1="195" y1="44" x2="325" y2="44"></line>
      <rect class="txt" x="205" y="50" width="104" height="6" rx="3"></rect>
      <rect class="hud" x="215" y="164" width="90" height="14" rx="7"></rect><circle class="rec" cx="225" cy="171" r="3"></circle>
    </g>
    <!-- Screen + camera: the same, plus the camera bubble beside the prompter. -->
    <g class="scene" id="both" opacity="0">
      <rect class="dev" x="80" y="6" width="360" height="188" rx="12"></rect>
      <rect class="scr" x="92" y="20" width="336" height="164" rx="4"></rect>
      <rect class="ui" x="92" y="20" width="70" height="164"></rect>
      <rect class="ui" x="180" y="100" width="110" height="34" rx="5"></rect><rect class="ui" x="300" y="100" width="110" height="34" rx="5"></rect>
      <circle class="lens" cx="260" cy="13" r="3"></circle>
      <rect class="stg" x="195" y="24" width="130" height="44" rx="7" opacity="0.88"></rect>
      <rect class="txt-read" x="205" y="32" width="84" height="5" rx="2.5"></rect>
      <line class="line" x1="195" y1="44" x2="325" y2="44"></line>
      <rect class="txt" x="205" y="50" width="104" height="6" rx="3"></rect>
      <circle class="bub" cx="352" cy="46" r="20"></circle>
      <rect class="hud" x="215" y="164" width="90" height="14" rx="7"></rect><circle class="rec" cx="225" cy="171" r="3"></circle>
    </g>
  </svg>
  <p class="desc" id="desc"></p>
</div>
<script>
(function () {
  var DESC = {
    camera: 'Phone: the prompter covers the top of the preview, next to the lens. Desktop: it docks under the webcam. Glass rig: the whole display, mirrored.',
    screen: 'A Prompter window under the webcam and a HUD at the bottom, both hidden from capture. The video holds only the screen.',
    both: 'As Screen, plus a camera bubble beside the prompter. The camera records to its own file; the layout is chosen after recording.'
  };
  function show(m) {
    ['camera', 'screen', 'both'].forEach(function (k) { document.getElementById(k).setAttribute('opacity', k === m ? '1' : '0'); });
    document.getElementById('desc').textContent = DESC[m];
  }
  Array.prototype.slice.call(document.querySelectorAll('[data-m]')).forEach(function (b) {
    b.onclick = function () {
      Array.prototype.slice.call(document.querySelectorAll('[data-m]')).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      show(b.getAttribute('data-m'));
    };
  });
  show('camera');
})();
</script>
</body>
</html>
