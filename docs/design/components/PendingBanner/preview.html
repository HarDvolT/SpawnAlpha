<!-- @dsCard group="Editor" height=100 subtitle="Shown while proposed cues wait for review" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pending banner — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Readex+Pro:wght@300..700&family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Reem+Kufi:wght@400..700&family=Caveat:wght@500..700&family=Aref+Ruqaa:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
  html, body { margin: 0; } body { padding: 16px; }
  .sa-banner { max-width: 720px; }
  .msg { flex: 1 1 260px; font-size: 14px; line-height: 20px; display: flex; gap: 10px; align-items: center; }
  .count { min-width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--cue); color: var(--on-cue); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
</style>
</head>
<body class="sa">
<div class="sa-banner" role="status">
  <div class="msg"><span class="count">18</span><span>Proposed cues are faded until you accept them. Tap a word to change one.</span></div>
  <button class="sa-btn sa-btn-plain">Discard</button>
  <button class="sa-btn sa-btn-cue"><span class="sa-i">done_all</span>Accept all</button>
</div>
<script>/* Static card. */</script>
</body>
</html>
