<!-- @dsCard group="Cues" height=360 subtitle="The editor's Marks view: proposed cues draw in, then settle when accepted" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Marked script — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
  body { margin: 0; padding: 16px; }
  .bar { margin-bottom: 14px; }
  .page { max-width: 720px; }
  .note { margin-top: 10px; }
</style>
</head>
<body class="sa">
<div class="page">
  <div class="sa-row bar">
    <button class="sa-btn" id="replay"><span class="sa-i">auto_awesome</span>Run the director's pass</button>
    <button class="sa-btn sa-btn-cue" id="accept"><span class="sa-i">done_all</span>Accept all</button>
  </div>
  <p class="sa-script" id="script">
    <span class="cue-text sa-stress">Last quarter,</span> our support team answered
    <span class="cue-text sa-stress">12,000</span> <span class="sa-nb">tickets.<span class="cue sa-g sa-g-long" title="Long pause"><span class="sa-i fill">pause_circle</span></span></span>
    <span class="cue-text sa-slower"><span class="sa-nb"><span class="cue sa-g sa-g-slower" title="Slow down"><span class="sa-i">keyboard_double_arrow_down</span><small>slow</small></span>That</span> is twice as many as the year <span class="sa-nb">before,<span class="cue sa-g sa-g-breath" title="Breathe"><span class="sa-i">air</span></span></span></span>
    with the <span class="sa-select">same</span> <span class="sa-nb">team.<span class="cue sa-g sa-g-pause" title="Pause"><span class="sa-i fill">pause</span></span></span>
    <span class="cue-text sa-energy"><span class="sa-nb"><span class="cue sa-g sa-g-energy"><span class="sa-i fill">bolt</span></span>So</span> how did we do it?</span>
  </p>
  <div class="sa-caption note">Faded cues are proposals. The word "same" is selected: its sheet is open.</div>
</div>
<script>
  var glyphs = Array.prototype.slice.call(document.querySelectorAll('#script .cue'));
  var words = Array.prototype.slice.call(document.querySelectorAll('#script .cue-text'));
  // Reading order: sort every cue by its position in the text.
  var all = glyphs.concat(words).sort(function (a, b) {
    return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
  });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reset(el) { el.classList.remove('sa-cue-in', 'sa-cue-settle'); el.style.animationDelay = ''; el.style.transitionDelay = ''; }
  function pass() {
    var step = reduce ? 0 : Math.min(18, 800 / Math.max(all.length, 1));
    all.forEach(function (el) { reset(el); el.classList.add('sa-off'); el.classList.remove('sa-pending'); });
    void document.body.offsetWidth;
    all.forEach(function (el, i) {
      el.classList.remove('sa-off');
      el.classList.add('sa-pending');
      if (glyphs.indexOf(el) >= 0) {
        if (!reduce) { el.classList.add('sa-cue-in'); el.style.animationDelay = (i * step) + 'ms'; }
      } else {
        el.style.transitionDelay = (i * step) + 'ms';
      }
    });
  }
  function acceptAll() {
    var step = reduce ? 0 : Math.min(18, 400 / Math.max(all.length, 1));
    all.forEach(function (el, i) {
      reset(el);
      void el.offsetWidth;
      el.classList.remove('sa-pending');
      if (glyphs.indexOf(el) >= 0) {
        if (!reduce) { el.classList.add('sa-cue-settle'); el.style.animationDelay = (i * step) + 'ms'; }
      } else {
        el.style.transitionDelay = (i * step) + 'ms';
      }
    });
  }
  document.getElementById('replay').onclick = pass;
  document.getElementById('accept').onclick = acceptAll;
  pass();
</script>
</body>
</html>
