<!-- @dsCard group="Actions" height=120 subtitle="Primary, secondary, cue, plain, danger and icon buttons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Readex+Pro:wght@300..700&family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Reem+Kufi:wght@400..700&family=Caveat:wght@500..700&family=Aref+Ruqaa:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style> html, body { margin: 0; } body { padding: 16px; } </style>
</head>
<body class="sa">
<div class="sa-row">
  <button class="sa-btn sa-btn-primary"><span class="sa-i">auto_awesome</span>Mark up with Claude</button>
  <button class="sa-btn">Practice</button>
  <button class="sa-btn sa-btn-cue"><span class="sa-i">done_all</span>Accept all</button>
  <button class="sa-btn sa-btn-plain">Discard</button>
  <button class="sa-btn sa-btn-danger"><span class="sa-i">delete</span>Delete script</button>
  <button class="sa-btn sa-btn-icon" aria-label="Settings"><span class="sa-i">settings</span></button>
  <button class="sa-btn" disabled>Record again</button>
</div>
<script>/* Static: tab through the row to see the focus ring. */</script>
</body>
</html>
