<!-- @dsCard group="Recording" height=560 subtitle="Screen recording on desktop: what the speaker sees, and what the video gets" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Screen recording — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Readex+Pro:wght@300..700&family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Reem+Kufi:wght@400..700&family=Caveat:wght@500..700&family=Aref+Ruqaa:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
  html, body { margin: 0; }
  body { padding: 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .monitor { position: relative; max-width: 640px; margin: 0 auto; background: #0b0c0f; border-radius: 14px; padding: 18px 12px 12px; }
  .cam { position: absolute; top: 6px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #2a2f38; box-shadow: 0 0 0 2px #15171c; }
  .screen { position: relative; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: #e9ecf1; }
  .screen.frame::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--stage-rec); border-radius: 6px; pointer-events: none; }
  /* A fake app being demonstrated, drawn in blocks. */
  .app { position: absolute; inset: 0; display: grid; grid-template-columns: 22% 1fr; }
  .side { background: #d9dee6; padding: 12% 10%; display: flex; flex-direction: column; gap: 8px; }
  .side i, .main i { display: block; height: 8px; border-radius: 4px; background: #b7bfcc; }
  .main { padding: 16% 6% 6%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .main .card { height: 64px; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 2px #00000014; }
  .main .card.hl { box-shadow: 0 0 0 2px #3a6df0; }
  .protected { transition: opacity var(--dur-base) var(--ease-standard); }
  .recorded .protected { opacity: 0; }
  .prompter { position: absolute; top: 2%; left: 50%; transform: translateX(-50%); width: 46%; border-radius: var(--radius-md); background: var(--stage-glass); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 0 0 1px var(--stage-glass-edge), var(--shadow-float); padding: 8px 14px 10px; color: var(--stage-text); }
  .prompter .grab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .prompter .grab b { width: 28px; height: 4px; border-radius: 2px; background: #ffffff40; }
  .prompter .txt { font-size: clamp(12px, 2.2vw, 19px); line-height: 1.45; font-weight: 500; }
  .prompter .txt .done { color: var(--stage-text-read); }
  .prompter .rl { height: 1px; background: var(--stage-line); margin: 2px 0; }
  .bubble { position: absolute; top: 3%; right: 12%; width: 13%; aspect-ratio: 1; border-radius: var(--radius-full); background: radial-gradient(circle at 50% 38%, #56607a, #1b2029 70%); display: grid; place-items: center; color: #aab2c3; box-shadow: 0 0 0 3px #ffffff, var(--shadow-float); }
  .bubble .sa-i { font-size: clamp(22px, 5vw, 44px); }
  .hudwrap { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%) scale(0.8); transform-origin: bottom center; }
  .recorded .hudwrap { transform: translateX(-50%) scale(0.8); }
  .files { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .file { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
  .note { text-align: center; margin-top: 8px; }
</style>
</head>
<body class="sa">
<div class="top">
  <div class="sa-seg" role="group" aria-label="Mode">
    <button aria-pressed="false" data-mode="screen"><span class="sa-i">screen_share</span>Screen</button>
    <button aria-pressed="true" data-mode="both"><span class="sa-i">picture_in_picture_alt</span>Screen + camera</button>
  </div>
  <div class="sa-seg" role="group" aria-label="View">
    <button aria-pressed="true" data-view="see"><span class="sa-i">visibility</span>What you see</button>
    <button aria-pressed="false" data-view="rec"><span class="sa-i">movie</span>What's recorded</button>
  </div>
</div>
<div class="monitor">
  <span class="cam" title="Webcam"></span>
  <div class="screen" id="screen">
    <div class="app"><div class="side"><i></i><i style="width:70%"></i><i style="width:85%"></i><i style="width:60%"></i></div>
      <div class="main"><div class="card hl"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>
    <div class="prompter protected">
      <div class="grab"><span class="sa-hidden-tag"><span class="sa-i">visibility_off</span>Hidden from recording</span><b></b><span class="sa-i" style="font-size:16px;color:var(--stage-chrome-text)">lock_open</span></div>
      <div class="txt"><span class="done">Open the Settings panel on the left.</span><span class="sa-g sa-g-long" style="color:var(--stage-pause)"><span class="sa-i fill">pause_circle</span></span></div>
      <div class="rl"></div>
      <div class="txt">Then <span style="color:var(--stage-stress);font-weight:700;font-size:1.15em">click</span> the first card<span class="sa-g" style="color:var(--stage-breath)"><span class="sa-i">air</span></span> and wait.</div>
    </div>
    <div class="bubble protected" id="bubble"><span class="sa-i fill">person</span></div>
    <div class="hudwrap protected"><div class="sa-hud"><span class="sa-tally"></span><span class="sa-mono" style="font-size:13px;color:var(--stage-text)">00:01:24</span><button title="Pause"><span class="sa-i fill">pause</span></button><button class="stop" title="Stop"><span class="sa-i fill">stop_circle</span></button><span class="sep"></span><button title="Prompter" aria-pressed="true"><span class="sa-i">subject</span></button></div></div>
  </div>
</div>
<div class="files" id="files"></div>
<div class="sa-caption note" id="note"></div>
<script>
(function () {
  var mode = 'both', view = 'see';
  function render() {
    document.getElementById('bubble').style.display = mode === 'both' ? '' : 'none';
    document.getElementById('screen').classList.toggle('recorded', view === 'rec');
    var files = ['<span class="file"><span class="sa-i">movie</span>screen.mp4</span>'];
    if (mode === 'both') files.push('<span class="file"><span class="sa-i">videocam</span>camera.mp4</span>');
    document.getElementById('files').innerHTML = view === 'rec' ? files.join('') : '';
    document.getElementById('note').textContent = view === 'rec'
      ? 'The prompter, the HUD' + (mode === 'both' ? ' and the camera bubble are' : ' are') + ' excluded from capture.' + (mode === 'both' ? ' The camera goes to its own file, so the layout can change after recording.' : '')
      : 'The prompter docks under the webcam, so the speaker reads close to the lens.';
  }
  Array.prototype.slice.call(document.querySelectorAll('[data-mode],[data-view]')).forEach(function (b) {
    b.onclick = function () {
      var key = b.hasAttribute('data-mode') ? 'data-mode' : 'data-view';
      Array.prototype.slice.call(document.querySelectorAll('[' + key + ']')).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (key === 'data-mode') mode = b.getAttribute(key); else view = b.getAttribute(key);
      render();
    };
  });
  render();
})();
</script>
</body>
</html>
