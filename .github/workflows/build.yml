# Checks every push, and builds test versions of the app to download:
# a Windows app (zip) and an Android APK, under the run's Artifacts.
# They are test builds: unsigned for Windows, and signed with a debug key
# for Android. They are not for distribution to customers.
name: Build

on:
  push:
    paths: ['app/**', '.github/**']
  pull_request:
    paths: ['app/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name the APK after the commit
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SpawnAlpha-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SpawnAlpha-android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/SpawnAlpha-*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build windows --release
      # The whole Release folder is the app: spawnalpha.exe needs the DLLs and
      # the data folder beside it. The artifact downloads as one zip.
      - uses: actions/upload-artifact@v4
        with:
          name: SpawnAlpha-windows-${{ github.sha }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
